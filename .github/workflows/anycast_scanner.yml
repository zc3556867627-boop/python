name: Anycast Scanner (Direct Copy)

on:
  workflow_dispatch: # 在 GitHub 页面点击即可一键手动运行
  schedule:
    - cron: '0 */6 * * *'

# 直接在配置中申请写入权限，无需去 Settings 页面手动勾选
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: 执行高并发扫描
        run: |
          # 此处直接写死你的 SaaS 域名，无需配置任何 GitHub Secrets
          TARGET_DOMAIN="fast.12341234.lol"
          
          echo "[*] 开始扫描，目标域名: $TARGET_DOMAIN"
          go run main.go -host "$TARGET_DOMAIN" -c 350 -t 1000 -top 32

      - name: 渲染至 GitHub 网页摘要 (方便一键复制)
        run: |
          echo "### 🚀 最新 Anycast SaaS 优选 IP 列表" >> $GITHUB_STEP_SUMMARY
          echo "可以直接在下方代码框右上角点击一键复制：" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat clean_ips.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 保存至仓库文件目录 (clean_ips.txt)
        continue-on-error: true # 即使仓库全局禁止了推送，也不会导致任务报错
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add clean_ips.txt scan_results.csv
          git commit -m "update: 优选 Anycast 节点更新" || exit 0
          git push origin HEAD:${{ github.ref }}
